    <div class="banner">

    <h1>Welcome to...</h1>

    <p>I'm Formuna, a developer and tech enthusiast.</p>

    <div id="clicker"></div>

    <div class="grid">
      <div class="projects">
        <div class="project">
          <a href="https://github.com/FormunaGit/libjjs"><h3>libjjs</h3></a>
          <p style="padding: 0.25em">
            A Python library for creating

              Jujutsu Shenanigans
            </a>
            movesets.

          <img
            src="https://raw.githubusercontent.com/FormunaGit/libjjs/refs/heads/main/assets/libjjs-small.png"
            alt="libjjs logo"
          />
        </div>
        <div class="skills">
          <div>
            <span class="akar-icons--python-fill"></span>
            <span class="picon--lua"></span>
            <span class="devicon-plain--javascript"></span>
          </div>
          <hr />
          <div>
            <span class="selfhst--zed-light"></span>
            <span class="simple-icons--robloxstudio"></span>
            <span class="simple-icons--godotengine"></span>

          <hr />

          </div>
        </div>
      </div>
    </div>

    <i style="color: var(--bg4)">...yeah that's all.</i>

    <script>
      var byeaudio = new Audio("./bye bye.mp3");
      var flashbang = new Audio("./flashbang.mp3");
      const delay = (seconds) =>
        new Promise((resolve) => setTimeout(resolve, seconds * 1000));

      byeaudio.volume = 1;
      flashbang.volume = 0.3;

      $("#clicker").on("click", async function () {
        $('<img>')
            .attr('src', 'flashbang.gif?x=' + Math.random())
            .attr('alt', 'Descriptive text')
            .attr('id', 'flashbang')
            .appendTo('body');
        setTimeout(() => {
          byeaudio.play();
          setTimeout(() => {
            flashbang.play();
          }, 1000);
        }, 3000);
        await delay(4.45);
        $("#flashbang").remove();
        $("body").empty();
        $('<div></div>')
          .attr('id', 'remaining-text')
          .append('<i>you never saw anything here...</i>')
          .appendTo('body');
        $('<div></div>')
          .attr('id', 'flashbang-aftermath')
          .appendTo('body');

        setTimeout(() => {
          $('<p>...you wanna reload the page?</p>')
            .appendTo('#remaining-text');

          $('#remaining-text p').on('click', () => {
            location.reload();
          });
        }, 3000);
      });
    </script>
  </body>
</html>
